name: CI

# Gate every PR into main. Runs on the pull_request event only (one run per PR;
# a separate push trigger would double every run). On a public repo or GitHub
# Pro, require the "Typecheck & lint" and "RLS + E2E" checks in branch protection.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: RLS + E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Brings up the local stack in Docker (present on ubuntu-latest) and
      # applies every migration + seed — equivalent to `supabase db reset`.
      - name: Start Supabase
        run: supabase start

      - name: RLS / pgTAP tests
        run: supabase test db

      # The Playwright suite seeds data through the service role, reading
      # apps/web/.env.local. Generate it from the running local stack.
      - name: Write apps/web/.env.local from local Supabase
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > apps/web/.env.local
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> apps/web/.env.local
          # A TEST-ONLY Stripe webhook signing secret (not a real credential):
          # lets the webhook-route e2e sign fixture payloads and exercise the real
          # signature-verification path deterministically, with NO live Stripe.
          # STRIPE_SECRET_KEY stays unset, so every other payment surface renders
          # its gated state (mirror of the ANTHROPIC_API_KEY live-AI gating).
          echo "STRIPE_WEBHOOK_SECRET=whsec_test_supertrainer_ci" >> apps/web/.env.local
          # A TEST-ONLY cron secret (not a real credential): the data-rights,
          # budget-sweep and referral-settlement e2e tests drive their workers
          # over HTTP, and without this they SKIP — silently losing the tests
          # that prove an export is complete and a purge leaves nothing behind.
          echo "CRON_SECRET=ci_cron_secret_supertrainer" >> apps/web/.env.local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # playwright.config.ts starts `npm run dev` itself and waits for :3000.
      # ANTHROPIC_API_KEY is intentionally NOT provided here: the AI-dependent
      # e2e tests (interview/preview/style) skip when it's absent, keeping CI
      # deterministic and free of a paid-AI/credit dependency (a red CI because a
      # billing balance dipped is exactly the flakiness we don't want gating
      # merges). The live AI paths are exercised locally, by the eval scripts,
      # and in production.
      - name: Playwright smoke tests
        run: npm run test
        working-directory: apps/web

  bundle:
    name: Client-bundle secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Builds into its own directory and reads every byte a browser would
      # download, looking for the VALUES of server-only secrets as well as their
      # shapes. Catches the one-word mistake that ships a service-role key.
      - name: Build (scan output)
        run: NEXT_DIST_DIR=.next-scan npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-value
      - name: Scan client bundle
        run: node scripts/scan-client-bundle.mjs --build-dir .next-scan
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-value

  security:
    name: Security review (Claude)
    runs-on: ubuntu-latest
    # Only when the API key is configured — a missing key must not gate merges
    # with a red check nobody can fix from a fork.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Claude security review
        uses: anthropics/claude-code-security-review@main
        continue-on-error: true
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: "load,docs,supabase/tests"
